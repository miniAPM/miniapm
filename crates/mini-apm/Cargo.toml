[package]
name = "mini-apm"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "miniapm"
path = "src/bin/server/main.rs"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite", "sqlx/sqlite-bundled"]
test-support = []
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring-webpki", "dep:jiff-sqlx", "jiff-sqlx/postgres"]

[dependencies]
tokio = { workspace = true }
rama = { workspace = true }
sqlx = { workspace = true }
jiff-sqlx = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
usage-lib = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
state-machines = { workspace = true }
