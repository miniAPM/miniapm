{% extends "layout.html" %}

{% block title %}Dashboard - MiniAPM{% endblock %}

{% block content %}
<h1>Dashboard</h1>

<div data-init="@get('/dashboard/live', {retry: 'always'})">
    {{ live|safe }}
</div>

<script>
(function() {
    let last = null;

    function cssVar(name, fallback) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
    }

    function drawChart(canvasId, data, values, color, unit, deployHours) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || values.length === 0) return;

        const textMuted = cssVar('--text-muted', '#8b95a8');
        const bgColor = cssVar('--bg', '#1a1f2e');
        const accentColor = cssVar('--accent', '#e67e22');

        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();

        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        const padding = { top: 10, right: 10, bottom: 25, left: 45 };
        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        const maxVal = Math.max(...values, 1);
        const stepX = chartWidth / (values.length - 1 || 1);

        // Draw grid lines
        ctx.strokeStyle = bgColor;
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            const y = padding.top + (chartHeight / 4) * i;
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(width - padding.right, y);
            ctx.stroke();
        }

        // Draw line
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        values.forEach((val, i) => {
            const x = padding.left + i * stepX;
            const y = padding.top + chartHeight - (val / maxVal) * chartHeight;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Draw area fill
        ctx.fillStyle = color + '20';
        ctx.beginPath();
        ctx.moveTo(padding.left, padding.top + chartHeight);
        values.forEach((val, i) => {
            const x = padding.left + i * stepX;
            const y = padding.top + chartHeight - (val / maxVal) * chartHeight;
            ctx.lineTo(x, y);
        });
        ctx.lineTo(padding.left + (values.length - 1) * stepX, padding.top + chartHeight);
        ctx.closePath();
        ctx.fill();

        // Draw Y axis labels
        ctx.fillStyle = textMuted;
        ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'right';
        for (let i = 0; i <= 4; i++) {
            const val = Math.round(maxVal * (4 - i) / 4);
            const y = padding.top + (chartHeight / 4) * i + 3;
            ctx.fillText(val + unit, padding.left - 5, y);
        }

        // Draw X axis labels (show every few, just the hour)
        ctx.textAlign = 'center';
        const labelStep = Math.ceil(data.length / 6);
        data.forEach((d, i) => {
            if (i % labelStep === 0 || i === data.length - 1) {
                const x = padding.left + i * stepX;
                // Extract just the hour from "2026-01-04 01:00" format
                const hour = d.hour.split(' ')[1] || d.hour;
                ctx.fillText(hour, x, height - 5);
            }
        });

        // Draw deploy markers
        if (deployHours.length > 0) {
            ctx.strokeStyle = accentColor;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;

            deployHours.forEach(hour => {
                const closestIdx = data.findIndex(d => d.hour === hour);
                if (closestIdx >= 0) {
                    const x = padding.left + closestIdx * stepX;
                    ctx.beginPath();
                    ctx.moveTo(x, padding.top);
                    ctx.lineTo(x, padding.top + chartHeight);
                    ctx.stroke();

                    // Draw deploy marker icon
                    ctx.setLineDash([]);
                    ctx.fillStyle = accentColor;
                    ctx.beginPath();
                    ctx.moveTo(x, padding.top);
                    ctx.lineTo(x - 5, padding.top - 8);
                    ctx.lineTo(x + 5, padding.top - 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.setLineDash([4, 4]);
                }
            });
            ctx.setLineDash([]);
        }
    }

    window.drawDashboardCharts = function(data, deployHours) {
        last = [data, deployHours];
        drawChart('trafficCanvas', data, data.map(d => d.count), cssVar('--primary', '#6b9fdb'), '', deployHours);
        drawChart('latencyCanvas', data, data.map(d => d.avg_ms), cssVar('--warning', '#e5b857'), 'ms', deployHours);
    };

    // Redraw on theme change
    const observer = new MutationObserver(() => {
        if (last) setTimeout(() => window.drawDashboardCharts(...last), 50);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
<script type="module" src="/static/datastar.js"></script>
{% endblock %}
