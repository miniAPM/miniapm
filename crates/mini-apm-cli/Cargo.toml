[package]
name = "mini-apm-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "miniapm-cli"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["mini-apm/sqlite"]
postgres = ["mini-apm/postgres"]

[dependencies]
mini-apm = { workspace = true }
usage-lib = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
