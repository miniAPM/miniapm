[workspace]
members = ["crates/mini-apm", "crates/mini-apm-cli", "crates/mini-apm-admin"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
authors = ["Chris Hasinski <krzysztof.hasinski@gmail.com>"]
repository = "https://github.com/miniapm/miniapm"
homepage = "https://github.com/miniapm/miniapm"
keywords = ["apm", "monitoring", "tracing", "performance", "rails"]
categories = ["development-tools", "web-programming"]

[workspace.dependencies]
# Internal crates
mini-apm = { path = "crates/mini-apm" }
mini-apm-admin = { path = "crates/mini-apm-admin" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
rama = { version = "0.4.0", features = ["http-full", "grpc", "opentelemetry"] }

# Database
sqlx = { version = "0.9.0", default-features = false, features = [
    "sqlite",
    "sqlite-bundled",
    "runtime-tokio",
    "macros",
    "migrate",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Templates
askama = "0.12"

# CLI
usage-lib = { version = "6.11", default-features = false, features = ["cli-help"] }

# HTTP client - using rustls to avoid OpenSSL dependency
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utils
jiff = { version = "0.2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.21"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

# Authentication
argon2 = "0.5"
tower-cookies = "0.10"
time = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true